<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="u17V_qQyLyPU_UsODeTgAIZb1Fcy130Tx2NmqggDn8A" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farmers Connect</title>
    <meta
      name="description"
      content="Flock records, vets, suppliers and other farmers in one place, built for poultry farms in Kenya."
    />

    <!-- The brand mark. All of these are generated by scripts/build-icons.mjs. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#14532d" />
    <meta name="color-scheme" content="light dark" />

    <!-- Chooses light or dark before anything is drawn, so the page never
         flashes the wrong one: what this browser remembers, or failing that
         the phone's own setting. src/context/ThemeContext.jsx takes over
         once the app has loaded. Keep the key in step with src/lib/theme.js. -->
    <script>
      (function () {
        var theme = "light";
        try {
          var saved = localStorage.getItem("fc-theme");
          var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          theme = saved === "dark" || (saved !== "light" && systemDark) ? "dark" : "light";
        } catch (e) { /* storage blocked: light */ }
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0f1512");
      })();
    </script>
    <style>
      /* the colour behind the app while it loads, in either theme */
      html { background: #f7f8f5; }
      html[data-theme="dark"] { background: #0f1512; }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,560;0,9..144,700;1,9..144,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
